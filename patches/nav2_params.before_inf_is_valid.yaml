# =============================================================================
# nav2_params.yaml — Warehouse cleaning robot (ROS 2 Humble)
#
# REVISION for ground-truth localization (no slam_toolbox / no /map topic):
#   1. global_costmap is now EXPLICITLY sized to the warehouse and uses only
#      obstacle + inflation layers. Why: with no node publishing /map, the
#      static layer never resizes the costmap, and Nav2 falls back to its
#      built-in default of a 5x5 m box at origin (0,0) — the robot at map
#      (0,0) sits on its corner ("Robot is out of bounds") and every goal
#      outside the box is instantly ABORTED. Sizing it ourselves fixes that:
#         width 15, height 20, origin (-4,-4)  ->  covers map x[-4,11] y[-4,16]
#      The live lidar (obstacle_layer) marks the racks as the robot drives;
#      NavFn has allow_unknown: true so it can plan into not-yet-seen space.
#      NOTE: the saved map can still be DISPLAYED in RViz via map_server
#      (show_map.launch.py) — display and planning are now independent.
#   2. bt_loop_duration 10 -> 20 ms (100 Hz -> 50 Hz). The UTM VM can't tick
#      at 100 Hz, which spammed "Behavior Tree tick rate 100.00 was exceeded!"
#      50 Hz is plenty and frees CPU.
#
# Kept from previous revisions:
#   * Regulated Pure Pursuit controller (no DWB wobble), 0.55 m/s with
#     regulated scaling (slows itself in tight turns).
#   * inflation_radius 0.40 so the narrow aisles stay navigable.
#   * NO 'default_nav_to_pose_bt_xml' line -> Nav2 uses its built-in BT.
#   * NO amcl section.
# =============================================================================

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/filtered
    bt_loop_duration: 20          # was 10; 50 Hz is enough on the UTM VM
    default_server_timeout: 250   # was 20 ms: too tight for this VM, the BT read a slow ack as a planner failure and ran spin+wait+backup
    # NOTE: default_nav_to_pose_bt_xml intentionally omitted -> Nav2 uses its
    # built-in navigate_to_pose_w_replanning_and_recovery.xml tree.
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node
      - nav2_smooth_path_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_assisted_teleop_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_drive_on_heading_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_globally_updated_goal_condition_bt_node
      - nav2_is_path_valid_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_truncate_path_local_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_path_expiring_timer_condition
      - nav2_distance_traveled_condition_bt_node
      - nav2_single_trigger_bt_node
      - nav2_goal_updated_controller_bt_node
      - nav2_is_battery_low_condition_bt_node
      - nav2_navigate_through_poses_action_bt_node
      - nav2_navigate_to_pose_action_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_planner_selector_bt_node
      - nav2_controller_selector_bt_node
      - nav2_goal_checker_selector_bt_node
      - nav2_controller_cancel_bt_node
      - nav2_path_longer_on_approach_bt_node
      - nav2_wait_cancel_bt_node
      - nav2_spin_cancel_bt_node
      - nav2_back_up_cancel_bt_node
      - nav2_assisted_teleop_cancel_bt_node
      - nav2_drive_on_heading_cancel_bt_node
      - nav2_is_battery_charging_condition_bt_node

# -----------------------------------------------------------------------------
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25     # must stay well BELOW the lane spacing (0.44-0.55 m),
                                  # or the robot registers the next lane as already
                                  # reached and drifts off the sweep pattern
      yaw_goal_tolerance: 6.28      # 2*pi: any orientation at the goal is OK.
                                    # Paired with coverage_nav2 setting each
                                    # goal's yaw to face the NEXT waypoint, this
                                    # removes the rotate-then-stop stutter that
                                    # used to happen at every goal when the
                                    # tolerance was 0.40 (~23 deg).

    # ---- Regulated Pure Pursuit: smooth path following, no DWB-style wobble ----
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.80
      # ---- lookahead: SHORT, so the robot tracks corners instead of cutting them ----
      # At 0.80 m/s the old velocity-scaled lookahead hit the 1.0 m cap. A 1.0 m
      # turning arc does not fit next to a wall the sweep turns at 0.40-0.60 m
      # from -- the robot arced into the inflation zone. That single fact caused
      # BOTH the wall-edge sticking and the zig-zag at row ends.
      lookahead_dist: 0.50
      min_lookahead_dist: 0.30
      max_lookahead_dist: 0.60
      lookahead_time: 0.70
      rotate_to_heading_angular_vel: 1.0
      transform_tolerance: 0.2
      use_velocity_scaled_lookahead_dist: true
      # ---- approach tuning: keep moving near goals instead of crawling ----
      # Old min 0.10 m/s + 0.5 m scaling distance meant the robot decelerated
      # over the last half meter and crawled across every waypoint, then had
      # to re-accelerate. With 60 waypoints that was the dominant cost.
      min_approach_linear_velocity: 0.30
      approach_velocity_scaling_dist: 0.25
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      # speed regulation: automatically slows on tight curves / near obstacles
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true   # slow down near obstacles
      regulated_linear_scaling_min_radius: 1.2   # start slowing earlier into curves
      regulated_linear_scaling_min_speed: 0.25
      # ---- rotate-in-place: ONLY for very sharp turns (>103 deg) ----
      # Old threshold 0.785 rad (45 deg) made every 90-deg row transition a
      # stop-rotate-drive event -> the wall-edge stutter. 1.80 rad (~103 deg)
      # lets RPP curve through ordinary 90-deg turns smoothly and still rotate
      # in place for the rare near-reversal.
      use_rotate_to_heading: true
      allow_reversing: false
      rotate_to_heading_min_angle: 1.80
      max_angular_accel: 2.5
      max_robot_pose_search_dist: 10.0

# -----------------------------------------------------------------------------
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"   # A* global planner
      tolerance: 0.5
      use_astar: true
      allow_unknown: true

# -----------------------------------------------------------------------------
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# -----------------------------------------------------------------------------
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "assisted_teleop", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

# -----------------------------------------------------------------------------
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    max_velocity: [0.80, 0.0, 1.0]      # matches RPP desired_linear_vel
    min_velocity: [-0.30, 0.0, -1.0]
    max_accel: [2.0, 0.0, 2.5]
    max_decel: [-1.5, 0.0, -2.5]
    odom_topic: "/odometry/filtered"
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# -----------------------------------------------------------------------------
# GLOBAL COSTMAP — static map RESTORED (show_map.launch.py / map_server now
# publishes /map), so the planner knows the racks and walls a priori instead
# of discovering them with the lidar. The explicit width/height/origin stay as
# a FALLBACK: if map_server isn't running, the costmap is still full-sized and
# the mission degrades gracefully to lidar-only planning instead of collapsing
# to Nav2's 5x5 m default box.
# -----------------------------------------------------------------------------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      transform_tolerance: 0.2
      robot_radius: 0.30
      resolution: 0.05
      track_unknown_space: true
      width: 15
      height: 20
      origin_x: -4.0
      origin_y: -4.0
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 8.0
          raytrace_min_range: 0.0
          obstacle_max_range: 6.0
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        # inflation_radius 0.40, NOT 0.30. At 0.30 it equalled robot_radius, so
        # there was NO soft-cost band at all and the global planner would route
        # a transit exactly along the lethal boundary. Any tracking error then
        # wedged the robot -- both observed stalls sat at 0.35 m from an
        # obstacle. 0.40 gives the planner a reason to keep its distance while
        # still leaving the 0.42 m aisle lanes at zero cost.
        inflation_radius: 0.40
        cost_scaling_factor: 4.0

      always_send_full_costmap: true

# -----------------------------------------------------------------------------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.2
      rolling_window: true
      width: 5
      height: 5
      resolution: 0.05
      robot_radius: 0.30
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: true
          marking: true
          data_type: "LaserScan"
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 3.5
          obstacle_min_range: 0.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.40
        cost_scaling_factor: 4.0

      always_send_full_costmap: true

# -----------------------------------------------------------------------------
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 200